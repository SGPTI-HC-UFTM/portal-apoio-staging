<ui:composition template="/templates/default.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

	<ui:define name="content">
		<h2>Tipos de Projeto</h2>

		<h:form id="formTiposProjeto">
			<div class="ui-fluid formgrid grid">
				<div class="field col-2">
					<p:commandButton id="btnNovo" value="Novo" icon="pi pi-plus"
						action="#{tiposProjetoController.openDialogNovo}" update="dialogTipoProjeto"
					/>
				</div>	
			</div>
		
			<p:dataTable id="tblTiposProjeto" var="tipo" value="#{tiposProjetoController.tipos}"
							emptyMessage="Nenhum registro encontrado.">
				<p:column headerText="Código" field="id" style="width: 10%; text-align: center" />

				<p:column headerText="Descrição" field="descricao" style="width: 30%; text-align: center"/>
				
				<p:column headerText="Ações" style="width:20%; text-align: center">
					<p:commandButton id="btnEdita" icon="pi pi-pencil" 
					action="#{tiposProjetoController.editaTipo(tipo)}"
					update="dialogTipoProjeto"
					title="Editar"/>
			
					<p:commandButton id="btnExclui" icon="pi pi-trash" style="margin-left:2px"
									action="#{tiposProjetoController.excluiTipo(tipo)}"
									update="@form" title="Excluir">
						<p:confirm header="Confirmação" message="Deseja realmente excluir o tipo de projeto selecionado?"
								   icon="pi pi-exclamation-triangle" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
		</h:form>

		<ui:include src="dialog-tipo-projeto.xhtml" />
	</ui:define>
</ui:composition>
