<ui:composition
  template="/templates/default.xhtml"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
>
  <ui:define name="content">
    <h2>Calculadora do Teste do Pezinho</h2>

    <h:form id="formCalculadoraTestePezinho">
      <p:messages id="messages" showDetail="false" closable="true" />

      <div class="ui-fluid formgrid grid">
        <div class="col-12">
          <p:fieldset>
            <f:facet name="legend">
              <i
                class="pi pi-book"
                style="margin-right: 8px; vertical-align: middle"
              ></i>
              <h:outputText
                value="Dados do Recém-Nascido"
                style="vertical-align: middle"
              />
            </f:facet>

            <div class="ui-g ui-fluid">
              <div class="field col-6">
                <p:outputLabel
                  for="nomeRecemNascido"
                  value="Nome do Recém-Nascido:"
                />

                <p:inputText
                  id="nomeRecemNascido"
                  value="#{calculadoraNeonatalController.calculadoraNeonatal.nomeRecemNascido}"
                  required="true"
                  requiredMessage="Informe o nome completo do recém-nascido."
                  placeholder="Nome completo"
                />
              </div>

              <div class="field col-6">
                <p:outputLabel for="nomeMae" value="Nome da Mãe:" />

                <p:inputText
                  id="nomeMae"
                  value="#{calculadoraNeonatalController.calculadoraNeonatal.nomeMae}"
                  required="false"
                  requiredMessage="Informe o nome completo da mãe."
                  placeholder="Nome completo da mãe"
                />
              </div>

              <div class="field col-6">
                <p:outputLabel for="dtNascimento" value="Data de Nascimento:" />

                <p:datePicker
                  id="dtNascimento"
                  size="30"
                  locale="pt_BR"
                  pattern="dd/MM/yyyy"
                  mask="true"
                  placeholder="dd/mm/aaaa"
                  showIcon="true"
                  monthNavigator="true"
                  yearNavigator="true"
                  value="#{calculadoraNeonatalController.calculadoraNeonatal.dataNascimentoRecemNascido}"
                  requiredMessage="Informe a data de nascimento."
                  required="true"
                  maxdate="#{calculadoraNeonatalController.dataHoje}"
                >
                </p:datePicker>

                <h:outputText
                  style="font-size: 0.75rem; color: #94a3b8"
                  value="Aceita datas dos últimos 12 meses."
                />
              </div>
            </div>
          </p:fieldset>
        </div>

        <div class="col-12 mt-4">
          <p:fieldset>
            <f:facet name="legend">
              <i
                class="pi pi-book"
                style="margin-right: 8px; vertical-align: middle"
              ></i>
              <h:outputText
                value="Parâmetros Clínicos"
                style="vertical-align: middle"
              />
            </f:facet>

            <div class="ui-g ui-fluid">
              <div class="field col-4">
                <p:outputLabel
                  for="estabilidadeRecemNascido"
                  value="Estabilidade do RN:"
                />

                <p:selectOneRadio
                  id="estabilidadeRecemNascido"
                  value="#{calculadoraNeonatalController.calculadoraNeonatal.estabilidadeRecemNascido}"
                  layout="pageDirection"
                  required="true"
                  requiredMessage="Selecione a estabilidade do recém-nascido."
                >
                  <f:selectItem itemLabel="ESTÁVEL" itemValue="true" />
                  <f:selectItem itemLabel="INSTÁVEL" itemValue="false" />
                </p:selectOneRadio>
              </div>

              <div class="field col-4">
                <p:outputLabel for="pesoNascimento" value="Peso ao Nascer:" />

                <p:selectOneRadio
                  id="pesoNascimento"
                  value="#{calculadoraNeonatalController.calculadoraNeonatal.pesoAoNascer}"
                  layout="pageDirection"
                  required="true"
                  requiredMessage="Selecione o peso ao nascer."
                >
                  <f:selectItem
                    itemLabel="&#8805; 1500g"
                    itemValue="true"
                  />
                  <f:selectItem
                    itemLabel="&lt; 1500g"
                    itemValue="false"
                  />
                </p:selectOneRadio>
              </div>

              <div class="field col-4">
                <p:outputLabel
                  for="idadeGestacional"
                  value="Idade Gestacional:"
                />

                <p:selectOneRadio
                  id="idadeGestacional"
                  value="#{calculadoraNeonatalController.calculadoraNeonatal.idadeGestacional}"
                  layout="pageDirection"
                  required="true"
                  requiredMessage="Selecione o idade gestacional."
                >
                  <f:selectItem
                    itemLabel="&#8805; 32 semanas"
                    itemValue="true"
                  />
                  <f:selectItem
                    itemLabel="&lt; 32 semanas"
                    itemValue="false"
                  />
                </p:selectOneRadio>
              </div>
            </div>
          </p:fieldset>
        </div>

        <div class="col-12 mt-4">
          <p:fieldset>
            <f:facet name="legend">
              <i
                class="pi pi-book"
                style="margin-right: 8px; vertical-align: middle"
              ></i>
              <h:outputText
                value="Hemotransfusão"
                style="vertical-align: middle"
              />
            </f:facet>

            <div class="ui-g ui-fluid">
              <div class="field col-12">
                <p:outputLabel
                  for="ocorreuHemotransfusaoAntesPrimeiraColeta"
                  value="O RN recebeu hemotransfusão antes da 1º coleta?"
                />

                <p:selectOneRadio
                  id="ocorreuHemotransfusaoAntesPrimeiraColeta"
                  value="#{calculadoraNeonatalController.calculadoraNeonatal.hemotransfusaoAntesPrimeiraColeta}"
                  layout="lineDirection"
                  required="true"
                  requiredMessage="Informe se o RN recebeu hemotransfusão antes da 1º coleta."
                >
                  <f:selectItem itemLabel="Não" itemValue="false" />
                  <f:selectItem itemLabel="Sim" itemValue="true" />

                  <p:ajax event="change" process="@this" update="painelCondicional" />
                </p:selectOneRadio>
              </div>

              <p:divider />

              <div class="field col-12">
                <p:outputLabel
                  for="ocorreuHemotransfusaoAposPrimeiraColeta"
                  value="Houve transfusão após a 1º coleta?"
                />

                <p:selectOneRadio
                  id="ocorreuHemotransfusaoAposPrimeiraColeta"
                  value="#{calculadoraNeonatalController.calculadoraNeonatal.hemotransfusaoAposPrimeiraColeta}"
                  layout="lineDirection"
                  required="true"
                  requiredMessage="Informe se houve transfusão após a 1º coleta."
                >
                  <f:selectItem itemLabel="Não" itemValue="false" />
                  <f:selectItem itemLabel="Sim" itemValue="true" />

                  <p:ajax event="change" update="painelCondicional" />
                </p:selectOneRadio>
              </div>

              <h:panelGroup id="painelCondicional" class="field col-12">
                <p:outputLabel
                  rendered="#{calculadoraNeonatalController.calculadoraNeonatal.hemotransfusaoAposPrimeiraColeta || calculadoraNeonatalController.calculadoraNeonatal.hemotransfusaoAntesPrimeiraColeta}"
                  for="dtUltimaTransfusao"
                  value="Data da última transfusão:"
                />

                <p:datePicker
                  id="dtUltimaTransfusao"
                  rendered="#{calculadoraNeonatalController.calculadoraNeonatal.hemotransfusaoAposPrimeiraColeta || calculadoraNeonatalController.calculadoraNeonatal.hemotransfusaoAntesPrimeiraColeta}"
                  size="30"
                  locale="pt_BR"
                  pattern="dd/MM/yyyy"
                  mask="true"
                  placeholder="dd/mm/aaaa"
                  showIcon="true"
                  monthNavigator="true"
                  yearNavigator="true"
                  value="#{calculadoraNeonatalController.calculadoraNeonatal.dataUltimaHemotransfusao}"
                  requiredMessage="Informe a data da última transfusão."
                  required="true"
                />
              </h:panelGroup>
            </div>
          </p:fieldset>
        </div>

        <div class="col-12 mt-4">
          <p:fieldset>
            <f:facet name="legend">
              <i
                class="pi pi-book"
                style="margin-right: 8px; vertical-align: middle"
              ></i>
              <h:outputText
                value="Coletas Já Realizadas (para recálculo)"
                style="vertical-align: middle"
              />
            </f:facet>

            <div class="ui-g ui-fluid">
              <div class="field col-12">
                <h:outputText
                  style="font-size: 1rem; color: #94a3b8"
                  value="Preencha as datas das coletas já realizadas para recalcular apenas as pendentes."
                />
              </div>

              <ui:repeat
                value="#{calculadoraNeonatalController.calculadoraNeonatal.coletasRealizadas}"
                var="amostra"
                varStatus="status"
              >
                <div class="field col-3">
                  <p:outputLabel value="#{status.index + 1}ª Amostra" />

                  <p:datePicker
                    size="30"
                    locale="pt_BR"
                    pattern="dd/MM/yyyy"
                    mask="true"
                    placeholder="dd/mm/aaaa"
                    showIcon="true"
                    monthNavigator="true"
                    yearNavigator="true"
                    value="#{calculadoraNeonatalController.calculadoraNeonatal.coletasRealizadas[status.index]}"
                    requiredMessage="Informe a data da amostra."
                    required="false"
                    mindate="#{calculadoraNeonatalController.dataHoje}"
                  />
                </div>
              </ui:repeat>
            </div>
          </p:fieldset>
        </div>
      </div>

      <div class="field col-2">
        <p:commandButton
          id="btnCalcularDatas"
          value="Calcular Datas"
          action="#{calculadoraNeonatalController.calcular}"
          update=":dialogCalculadora"
          icon="pi pi-calendar"
          oncomplete="if (!args.validationFailed) PF('dialogCalculadora').show()"
          />
      </div>
    </h:form>

    <ui:include src="dialog-calculadora.xhtml" />
  </ui:define>
</ui:composition>
